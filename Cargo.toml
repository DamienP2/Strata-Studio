[workspace]
resolver = "2"
members = ["crates/strata-studio-core", "crates/strata-studio-devices", "crates/strata-studio-sense", "crates/strata-studio-server", "crates/strata-studio-bench", "crates/strata-studio-media"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
strata-studio-core = { path = "crates/strata-studio-core" }
strata-studio-devices = { path = "crates/strata-studio-devices" }
strata-studio-sense = { path = "crates/strata-studio-sense" }
strata-studio-media = { path = "crates/strata-studio-media" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
