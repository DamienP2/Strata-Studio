# Publie la release Ubuntu : le paquet .deb, une archive des exécutables et
# leurs sommes SHA-256. Construit sur Ubuntu 22.04 pour s'installer sur 22.04
# et 24.04. Se lance par une étiquette vX.Y.Z, ou à la main depuis l'onglet
# Actions avec la version (l'étiquette est alors créée sur le commit choisi).
name: Release Ubuntu

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  ubuntu:
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: echo "V=${VERSION#v}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: ffmpeg pour les essais d'enregistrement
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Essais
        run: cargo test --workspace --locked
      - name: Paquet
        run: packaging/build-deb.sh "$V"
      - name: Le paquet s'installe et le service démarre
        run: |
          sudo apt-get install -y ./dist/strata-studio_*_amd64.deb
          for i in $(seq 1 30); do curl -sf localhost:8095/api/health && break; sleep 1; done
          systemctl is-active strata-studio
          curl -sf localhost:8095/api/health
      - uses: actions/upload-artifact@v4
        with:
          name: strata-studio-ubuntu
          path: dist/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}
          target_commitish: ${{ github.sha }}
          name: Strata Studio ${{ env.V }}
          files: dist/*
          generate_release_notes: true
